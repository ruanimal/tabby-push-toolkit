name: Publish to npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write # Required to create a GitHub Release

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: pnpm

            - name: Validate release version
              id: version
              run: |
                  node <<'NODE'
                  const fs = require('node:fs')
                  const { version } = require('./package.json')
                  if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
                      console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${version}`)
                      process.exit(1)
                  }
                  const prerelease = version.includes('-')
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${prerelease ? 'next' : 'latest'}\nprerelease=${prerelease}\n`)
                  NODE

            - name: Check npm credentials
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                      echo '::error::Configure the NPM_TOKEN repository secret before publishing.'
                      exit 1
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Install test dependencies
              run: sudo apt-get update && sudo apt-get install -y busybox

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify
              run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm test

            # The prepack lifecycle script builds dist/ and typings/ before publishing.
            - name: Publish to npm
              run: pnpm publish --access public --no-git-checks --tag "$NPM_DIST_TAG"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}

            - name: Create GitHub Release
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
